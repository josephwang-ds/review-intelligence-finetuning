services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./runtime:/app/runtime
      - ./reports:/app/reports

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    env_file: .env
    volumes:
      - ./runtime:/app/runtime
      - ./reports:/app/reports
